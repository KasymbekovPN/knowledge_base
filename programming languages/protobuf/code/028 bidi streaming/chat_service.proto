syntax = "proto3";
package myapp;

message ChatMessage {
  string from = 1;
  string text = 2;
}

service ChatService {
  //  // Оба потока (клиент->сервер и сервер->клиент) полностью независимы:
  //  // ни одна сторона не обязана отвечать "один к одному" на сообщение другой.
  rpc Chat(stream ChatMessage) returns (stream ChatMessage);
}
