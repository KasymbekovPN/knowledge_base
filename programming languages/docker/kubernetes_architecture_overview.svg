<desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">Control plane содержит API Server, Scheduler, Controller Manager и etcd, которые вместе принимают решения о том, что и куда развернуть в кластере. Эти решения применяются к worker-узлам, где kubelet вместе с container runtime запускает поды с реальными контейнерами приложения</desc>
