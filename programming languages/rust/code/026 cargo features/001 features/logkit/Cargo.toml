[package]
name = "logkit"
version = "0.1.0"
edition = "2024"

[dependencies]
serde_json = { version = "1.0.151", optional = true }
chrono = { version = "0.4.45", optional = true, default-features = false, features = ["clock"]}

[features]
default = []
json = ["dep:serde_json"]
timestamps = ["dep:chrono"]
