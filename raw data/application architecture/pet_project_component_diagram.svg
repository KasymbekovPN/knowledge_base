<desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">Композиционный корень main.cpp связывает EventLoop и TaskBoardView. EventLoop зависит от commands, которая зависит от task_domain (Model). View зависит от task_domain, config и event_bus. Model публикует события через event_bus, на которые подписана View.</desc>
